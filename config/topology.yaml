# ---------------------------------------------------------------------------
# Mu2e DAQ node topology for the power-outage recovery tools.
#
# This file is deliberately shaped to stay compatible with
# mu2edaq-operations/scripts/nodes_config.yaml -- the per-network entry lists
# use the identical "plain hostname or NodeRange mapping" syntax, so lists can
# be copied between the two files without translation.  What is added here:
#
#   * a third location, mc1 (absent upstream)
#   * 'subnets:' recording the CIDR of each network per location, so the tools
#     can tell an operator *which* segment a failed interface belongs to
#   * 'gateways:' naming the jump hosts used to reach a location
#   * 'roles:' classifying each host into a subsystem class, which is what the
#     generated report tables are grouped by
#   * 'protected:' hosts that must never be issued a destructive IPMI command
#
# NodeRange fields (all except start/end optional), as upstream:
#   start, end, category, prefix, suffix, excludes, fmt
# expanding to  <prefix>-<category>-<fmt % n><suffix>.<domain>
#          or   <prefix><fmt % n><suffix>.<domain>   when category is empty.
# ---------------------------------------------------------------------------

domain: fnal.gov
default_prefix: mu2e

# Hosts that destructive IPMI verbs (power off / cycle / reset) are refused
# for, regardless of --execute.  Powering any of these off from a recovery
# run would cut the operator off from the cluster they are recovering, or
# take down the NFS/home server everything else mounts from.
# Mirrors (and extends) the exclude_list in mu2edaq-operations/mu2e_ipmi.sh.
protected:
  - mu2egateway01.fnal.gov
  - mu2egateway02.fnal.gov
  - mu2edaq-gateway.fnal.gov
  - mu2e-mgr-01.fnal.gov
  - mu2e-dcs-01.fnal.gov

# Host-class assignment.  First matching regex wins; a host matching nothing
# lands in class 'other'.  Classes drive the per-class report tables and the
# check profiles in config/checks.yaml.
roles:
  - {pattern: '^mu2e(daq)?-?gateway',   class: gateway}
  - {pattern: '^mu2e-mgr-',             class: manager}
  - {pattern: '^mu2e-dl-',              class: datalogger}
  - {pattern: '^mu2e-dcs-',             class: dcs}
  - {pattern: '^mu2e-cfo-',             class: cfo}
  - {pattern: '^mu2e-trk-',             class: tracker}
  - {pattern: '^mu2e-calo-',            class: calorimeter}
  - {pattern: '^mu2e-crv-',             class: crv}
  - {pattern: '^mu2e-stm-',             class: stm}
  - {pattern: '^mu2e-extmon-',          class: extmon}
  - {pattern: '^mu2e-worker-',          class: worker}
  - {pattern: '^mu2edaq[0-9]',          class: teststand}

# How to turn a lab-network hostname into its IPMI-network hostname.  The
# BMC of mu2e-trk-01.fnal.gov answers as mu2e-trk-01-ipmi.fnal.gov.
ipmi_suffix: '-ipmi'
data_suffix: '-data'

locations:

  # ==========================================================================
  # MC-2 -- the main DAQ room.  All three networks are present.
  # ==========================================================================
  mc2:
    label: MC-2
    description: MC-2 building, primary Mu2e DAQ computing centre
    gateways:
      - mu2egateway01.fnal.gov
      - mu2egateway02.fnal.gov
    subnets:
      lab:  131.225.245.0/24
      data: 10.226.9.0/24
      ipmi: 192.168.157.0/24
      mgmt: 131.225.245.0/24
    networks:

      mgmt:
        - mu2egateway01-mgmt.fnal.gov
        - mu2egateway02-mgmt.fnal.gov
        - mu2e-dcs-01-mgmt.fnal.gov
        - mu2e-dcs-02-mgmt.fnal.gov
        - mu2e-dcs-03-mgmt.fnal.gov

      lab:
        - mu2egateway01.fnal.gov
        - mu2egateway02.fnal.gov
        - mu2e-mgr-01.fnal.gov
        - mu2e-dcs-01.fnal.gov
        - mu2e-dcs-02.fnal.gov
        - mu2e-dcs-03.fnal.gov
        - mu2e-dl-01.fnal.gov
        - mu2e-dl-02.fnal.gov
        - mu2e-cfo-01.fnal.gov
        - {category: trk,    start: 1, end: 18}
        - {category: calo,   start: 1, end: 14}
        - {category: crv,    start: 1, end: 1}
        - {category: stm,    start: 1, end: 2}
        - {category: extmon, start: 1, end: 1}
        - {category: worker, start: 1, end: 3}

      ipmi:
        - mu2egateway01-ipmi.fnal.gov
        - mu2egateway02-ipmi.fnal.gov
        - mu2e-mgr-01-ipmi.fnal.gov
        - mu2e-dcs-01-ipmi.fnal.gov
        - mu2e-dcs-02-ipmi.fnal.gov
        - mu2e-dl-01-ipmi.fnal.gov
        - mu2e-dl-02-ipmi.fnal.gov
        - mu2e-cfo-01-ipmi.fnal.gov
        - {category: trk,  start: 1, end: 18, suffix: -ipmi,
           excludes: [5, 6, 7, 8, 10, 13]}
        - {category: calo, start: 1, end: 14, suffix: -ipmi,
           excludes: [8, 9, 10, 12]}
        - {category: crv,    start: 1, end: 1, suffix: -ipmi}
        - {category: stm,    start: 1, end: 2, suffix: -ipmi}
        - {category: extmon, start: 1, end: 1, suffix: -ipmi}
        - {category: worker, start: 1, end: 3, suffix: -ipmi}

      data:
        - mu2e-dl-01-data.fnal.gov
        - mu2e-dl-02-data.fnal.gov
        - mu2e-cfo-01-data.fnal.gov
        - {category: trk,    start: 1, end: 18, suffix: -data}
        - {category: calo,   start: 1, end: 14, suffix: -data}
        - {category: crv,    start: 1, end: 1,  suffix: -data}
        - {category: stm,    start: 1, end: 2,  suffix: -data}
        - {category: extmon, start: 1, end: 1,  suffix: -data}
        - {category: worker, start: 1, end: 3,  suffix: -data}

      pcie:
        - mu2e-cfo-01.fnal.gov
        - {category: trk,    start: 1, end: 18}
        - {category: calo,   start: 1, end: 14}
        - {category: crv,    start: 1, end: 1}
        - {category: stm,    start: 2, end: 2}
        - {category: extmon, start: 1, end: 1}

  # ==========================================================================
  # MC-1 -- satellite computing centre.  Lab network only; there is no data
  # network in MC-1 (Project-Description.md).
  #
  # *** The MC-1 node list is not yet known. ***  It is not carried in
  # mu2edaq-operations/scripts/nodes_config.yaml, which is the authoritative
  # upstream inventory, so nothing could be imported.  Add the hostnames
  # below and every phase will pick MC-1 up with no code change; until then
  # the tools report MC-1 as "no nodes configured" rather than as healthy.
  # ==========================================================================
  mc1:
    label: MC-1
    description: MC-1 building computing centre (inventory pending)
    gateways:
      # Reached through the MC-2 gateways until MC-1 gets its own.
      - mu2egateway01.fnal.gov
      - mu2egateway02.fnal.gov
    subnets:
      lab:  131.225.246.0/24
      ipmi: 192.168.157.0/24
    networks:
      lab: []
      ipmi: []

  # ==========================================================================
  # Teststand -- Helen Edwards Engineering Center (HEERC).
  #
  # Node status groups referenced by the excludes lists below:
  #   dead      : 1, 3, 5, 6, 12, 15, 16, 17   (decommissioned or offline)
  #   non_heerc : 2, 8, 9, 18-21, 23, 24       (present, outside the cluster)
  #   no_dtc    : 13, 14                       (no DTC/PCIe card installed)
  # ==========================================================================
  teststand:
    label: Teststand
    description: Helen Edwards Engineering Center (HEERC) test stand
    aliases: [heerc]
    gateways:
      - mu2edaq-gateway.fnal.gov
    subnets:
      lab:  131.225.237.0/24
      data: 10.226.9.0/24
      ipmi: 192.168.150.0/24
    networks:

      ctrl:
        - mu2edaq-gateway-ctrl.fnal.gov
        - {prefix: mu2edaq, start: 1, end: 24, suffix: -ctrl,
           excludes: [1, 2, 3, 5, 6, 8, 9, 12, 15, 16, 17, 18, 19, 20, 21, 23, 24]}

      lab:
        - mu2edaq-gateway.fnal.gov
        - {prefix: mu2edaq, start: 1, end: 24,
           excludes: [1, 3, 5, 6, 12, 15, 16, 17]}

      ipmi:
        - mu2edaq-gateway-ipmi.fnal.gov
        - {prefix: mu2edaq, start: 1, end: 24, suffix: -ipmi,
           excludes: [1, 2, 3, 5, 6, 8, 9, 12, 15, 16, 17, 18, 19, 20, 21, 23, 24]}

      data:
        - {prefix: mu2edaq, start: 1, end: 24, suffix: -data,
           excludes: [1, 2, 3, 5, 6, 8, 9, 12, 15, 16, 17, 18, 19, 20, 21, 23, 24]}

      pcie:
        - {prefix: mu2edaq, start: 1, end: 24,
           excludes: [1, 3, 5, 6, 12, 13, 14, 15, 16, 17]}
